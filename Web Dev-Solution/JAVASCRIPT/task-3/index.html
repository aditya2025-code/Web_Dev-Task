<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    </head>

<body>
    <div id="main">
        <div id="heading">
            <h1>SIMPLE CALCULATOR</h1>
        </div>
        <div id="inputs">
            <label class="inpt" for="input1">
                Enter the 1st number :<input id="input1" type="number" placeholder="2">
            </label>
            <label class="inpt" for="input2">
                Enter the 2nd number :<input id="input2" type="number" placeholder="2">
            </label>
            <label class="inpt" for="opt">
                Enter oparetor(+, -, *, /) :<input id="opt" type="text" placeholder="+">
            </label>
        </div>
        <div id="calbtn">
            <button id="btn" type="button">Calculate</button>
        </div>
        <div id="result">
            Result : <textarea name="" id="ans" placeholder="4" disabled></textarea>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
